source = ~/.config/hypr/themes/hypr.conf

$hypr = /home/restart/.config/hypr
$swayosd = /home/restart/.config/swayosd
$terminal = alacritty
$menu = fuzzel --list-executables-in-path
$browser = firefox
$mainMod = SUPER
$wsNoAnimScript = $hypr/scripts/workspace-noanim.sh

monitor = DP-2,2560x1440@239.97,1920x0,1
monitor = DP-3,2560x1440@239.97,1920x0,1
monitor = eDP-1,2880x1920@60,1920x1440,1.5

env = BROWSER,firefox
env = GTK_THEME,Adwaita-dark
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ADW_DISABLE_PORTAL,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once = swayosd-server --config $swayosd/config.toml --style $swayosd/style.css
exec-once = waybar
exec-once = $hypr/scripts/theme-wallpaper auto
exec-once = hypridle
exec-once = systemctl --user start laptop-refresh-on-power.service
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 3
    col.active_border = $theme_accent_rgba
    col.inactive_border = rgba(222222ff)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = global, 1, 10, default
    animation = border, 0, 1, default
    animation = windows, 0, 1, default
    animation = fade, 0, 1, default
    animation = layers, 0, 1, default
    animation = workspaces, 1, 12, easeOutQuint, slide
    workspace_wraparound = true
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

gesture = 3, right, scale: 0.5, dispatcher, exec, $hypr/scripts/workspace-gesture.sh next
gesture = 3, left, scale: 0.5, dispatcher, exec, $hypr/scripts/workspace-gesture.sh prev
gesture = 3, up, special
gesture = 3, down, fullscreen

bind = $mainMod, return, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, S, exec, $hypr/scripts/screenshot area
bind = $mainMod SHIFT, return, pseudo,
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bindel = $mainMod, D, exec, $menu
bind = $mainMod, T, exec, $hypr/scripts/theme-preview-picker
bind = $mainMod, grave, exec, $hypr/scripts/scratchpad terminal
bind = $mainMod, E, exec, $hypr/scripts/scratchpad files
bind = $mainMod, M, exec, $hypr/scripts/scratchpad music
bind = $mainMod SHIFT, S, exec, $hypr/scripts/screen-timeout-toggle toggle
bind = $mainMod SHIFT, P, exec, $hypr/scripts/low-power-toggle toggle
bind = $mainMod CTRL, S, exec, $hypr/scripts/screenshot edit
bindel = $mainMod, H, resizeactive, -10 0
bindel = $mainMod, L, resizeactive, 10 0
bind = $mainMod SHIFT, L, exec, hyprlock

bind = $mainMod, 1, exec, $wsNoAnimScript 1
bind = $mainMod, 2, exec, $wsNoAnimScript 2
bind = $mainMod, 3, exec, $wsNoAnimScript 3
bind = $mainMod, 4, exec, $wsNoAnimScript 4
bind = $mainMod, 5, exec, $wsNoAnimScript 5
bind = $mainMod, 6, exec, $wsNoAnimScript 6
bind = $mainMod, X, exec, $wsNoAnimScript 7
bind = $mainMod, C, exec, $wsNoAnimScript 8
bind = $mainMod, V, exec, $wsNoAnimScript 9

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, X, movetoworkspacesilent, 7
bind = $mainMod SHIFT, C, movetoworkspacesilent, 8
bind = $mainMod SHIFT, V, movetoworkspacesilent, 9

bind = $mainMod, mouse_down, exec, $wsNoAnimScript e+1
bind = $mainMod, mouse_up, exec, $wsNoAnimScript e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, $swayosd/hypr-osd volume-up
bindel = , XF86AudioLowerVolume, exec, $swayosd/hypr-osd volume-down
bindel = , XF86AudioMute, exec, $swayosd/hypr-osd volume-mute
bindel = , XF86AudioMicMute, exec, $swayosd/hypr-osd mic-mute
bindel = , XF86MonBrightnessUp, exec, $swayosd/hypr-osd brightness-up
bindel = , XF86MonBrightnessDown, exec, $swayosd/hypr-osd brightness-down
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = match:class rice.theme-picker, float on, center on, size 580 420
windowrule = match:class rice-scratch-terminal, float on, center on, size 920 560, workspace special:terminal silent
windowrule = match:class rice-scratch-files, float on, center on, size 920 560, workspace special:files silent
windowrule = match:class rice-scratch-music, float on, center on, size 760 420, workspace special:music silent
